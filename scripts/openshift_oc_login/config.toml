# Path to your maintained OpenShift credentials file.
# Example:
# credentials_file = "~/.oc-credentials.toml"
#
# Expected format of the external file:
# login_url = "https://oauth-openshift.apps.example.internal/oauth/token/request"
# username = "your.username"
# password = ""
#
# If username or password are empty or missing, the script asks interactively.

credentials_file = "~/.oc-credentials.toml"
