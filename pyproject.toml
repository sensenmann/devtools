[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools"
version = "0.1.0"
description = "Project maintenance runner with CLI and terminal UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.61,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

